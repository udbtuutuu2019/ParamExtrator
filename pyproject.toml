[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "param-extractor"
version = "0.1.0"
description = "Elastic data extraction Harness pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "instructor>=1.17",
    "openai>=1.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
